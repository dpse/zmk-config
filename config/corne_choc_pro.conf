# Corne Choc Pro BT - user configuration
# Applies to both halves (Kconfig.defconfig sets CONFIG_BOARD="corne_choc_pro").

# --- Display (nice!view): battery, output and layer status ------------------
# CONFIG_ZMK_DISPLAY is set by the nice_view shield itself. Setting it here
# would also apply it to display-less shields such as settings_reset, which
# then fails to link.

# --- Mouse emulation, required by the MOUSE layer ---------------------------
CONFIG_ZMK_POINTING=y

# --- RGB underglow ----------------------------------------------------------
# The WS2812 strip is described in the board .dts so the board definition stays
# accurate; off here means the driver is not built and the LEDs stay dark.
# Set to y to enable. Do not set CONFIG_WS2812_STRIP while this is off: that
# symbol only exists once LED_STRIP is enabled, and assigning to an undefined
# symbol is a hard Kconfig error.
CONFIG_ZMK_RGB_UNDERGLOW=n

# --- Power ------------------------------------------------------------------
# If a half ever goes unresponsive to both keys and the power switch, and only
# USB revives it, that is zmkfirmware/zmk#3207: the central crashes mid-suspend
# rather than sleeping, so it hangs in a high-power state. Intermittent, and
# unfixed upstream as of this writing. CONFIG_ZMK_SLEEP=n avoids it entirely.
CONFIG_ZMK_SLEEP=y

# Idle (display off, radio slows). Waking is instant and loses no keystroke.
# Note that battery sampling also stops while idle, so the level on the display
# is only refreshed once you touch the board again.
CONFIG_ZMK_IDLE_TIMEOUT=30000

# Deep sleep timeout. Only definable while CONFIG_ZMK_SLEEP=y - the symbol
# lives inside "if ZMK_SLEEP", so assigning to it with sleep off is a hard
# Kconfig error.
#
# Keep it generous: ZMK tracks activity per half (activity.c subscribes only to
# key and sensor events, with no relay from central to peripheral), so a half
# you happen not to type on for this long sleeps by itself and drops the split
# link while the other half keeps working.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# --- Leader -----------------------------------------------------------------
# Default is 32 and the compose shortcuts take us well past it. The cost is
# one pointer per sequence in a static candidates array.
CONFIG_ZMK_LEADER_MAX_SEQUENCES=128

# --- Bluetooth --------------------------------------------------------------
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Fix pairing issues
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
# Windows battery-reporting fix.
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
