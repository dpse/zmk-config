manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: urob
      url-base: https://github.com/urob

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main # Zephyr 4.1 / HWMv2. Pin to a SHA once the build is known good.
      import: app/west.yml

    # --- urob's ZMK modules -------------------------------------------------
    # zmk-helpers    - ZMK_LEADER_SEQUENCE and other convenience macros
    # zmk-auto-layer - num-word: number layer that cancels itself
    # zmk-leader-key - &leader sequences
    # zmk-tri-state  - alt-tab swapper (hold Alt across repeated Tabs)
    #
    # zmk-adaptive-key - context-dependent keys; drives magic-shift
    #
    # NOT enabled:
    #   zmk-unicode - only works in GTK apps on niri without IBus, and the
    #                 XKB AltGr layout already covers a/o/a everywhere.
    - name: zmk-helpers
      remote: urob
      revision: main
      path: modules/zmk/helpers
    - name: zmk-auto-layer
      remote: urob
      revision: main
      path: modules/zmk/auto-layer
    - name: zmk-leader-key
      remote: urob
      revision: main
      path: modules/zmk/leader-key
    - name: zmk-tri-state
      remote: urob
      revision: main
      path: modules/zmk/tri-state
    - name: zmk-adaptive-key
      remote: urob
      revision: main
      path: modules/zmk/adaptive-key

  self:
    path: config
