# This file generates the GitHub Actions matrix.
# Board IDs use the Zephyr HWMv2 form <board>/<soc>/<variant>.
---
include:
  - board: corne_choc_pro_left/nrf52840/zmk
    shield: nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_left
  - board: corne_choc_pro_right/nrf52840/zmk
    shield: nice_view
    artifact-name: corne_choc_pro_right

  # Flash these to wipe BLE pairings / stored settings on a half.
  - board: corne_choc_pro_left/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset_left
  - board: corne_choc_pro_right/nrf52840/zmk
    shield: settings_reset
    artifact-name: settings_reset_right
